services:
  # 1. Backend Web Service (Node.js + Socket.io)
  - type: web
    name: sih-quiz-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 4000
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: impossible
      - key: ADMIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: sih-quiz-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: sih-quiz-backend
          property: host
